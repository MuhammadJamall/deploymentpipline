name: Deploy to EC2

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::072718159856:role/GitHubActions-EC2-Deploy-Role
          aws-region: ca-central-1

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0b5c3cf8ddfd3e474" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions" \
            --parameters '{"commands":["cd /var/www/app","git pull origin main","systemctl reload nginx"]}' \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"
          sleep 8
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0b5c3cf8ddfd3e474" \
            --query "Status" --output text)
          echo "Command Status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment FAILED"
            exit 1
          fi
          echo "Deployment SUCCESSFUL"